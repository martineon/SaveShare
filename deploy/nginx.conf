# Bootstrap HTTP site. Certbot adds the HTTPS server and redirect afterwards.
# Replace the domain if deploying on another host.
server {
    listen 80;
    listen [::]:80;
    server_name saveshare.martineon.com;

    # Stream large binary worlds instead of buffering them to nginx's disk.
    client_max_body_size 1024m;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
